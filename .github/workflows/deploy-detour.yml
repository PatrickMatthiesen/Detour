name: Deploy Detour

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-detour-production
  cancel-in-progress: false

jobs:
  verify-ref:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

  verify:
    needs: verify-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
    steps:
      - name: Require successful CI for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const deadline = Date.now() + 10 * 60 * 1000;
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                branch: 'main',
                event: 'push',
                per_page: 1,
              });
              const run = data.workflow_runs[0];
              if (!run) {
                core.setFailed(`No main push CI run found for ${context.sha}. Run CI before deploying.`);
                return;
              }
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`CI ${run.conclusion} for ${context.sha}: ${run.html_url}`);
                  return;
                }
                core.info(`CI passed for ${context.sha}: ${run.html_url}`);
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed(`Timed out waiting for CI: ${run.html_url}`);
                return;
              }
              core.info(`Waiting for CI (${run.status}): ${run.html_url}`);
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    env:
      DOCKER_CONTEXT_NAME: detour-${{ github.run_id }}
      DEPLOY_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install Aspire CLI
        run: |
          curl --fail --silent --show-error --location https://aspire.dev/install.sh -o "$RUNNER_TEMP/install-aspire.sh"
          bash "$RUNNER_TEMP/install-aspire.sh" --version 13.6.0-preview.1.26421.15
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
      - name: Restore frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: 'true'
          version: latest
          ping: ${{ secrets.SSH_HOST }}
      - name: Add SSH host key
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Deploy with Aspire through Docker context
        env:
          ASPIRE_CONTAINER_RUNTIME: docker
          Parameters__postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          Parameters__garage_rpc_secret: ${{ secrets.GARAGE_RPC_SECRET }}
          Parameters__garage_admin_token: ${{ secrets.GARAGE_ADMIN_TOKEN }}
          Parameters__garage_access_key_id: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          Parameters__garage_secret_access_key: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          Parameters__GoogleClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          Parameters__GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          Parameters__GoogleMapsApiKey: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          Parameters__OwnerEmail: ${{ secrets.OWNER_EMAIL }}
          Parameters__ChatGptClientId: ${{ vars.CHATGPT_CLIENT_ID }}
          Parameters__ChatGptRedirectUri: ${{ vars.CHATGPT_REDIRECT_URI }}
          Detour__PublicUrl: ${{ vars.PUBLIC_URL || 'https://detour.patrickbm.com' }}
          Detour__KeysDirectory: ${{ vars.AUTH_KEYS_DIR || '/srv/detour/keys' }}
        run: |
          for parameter in Parameters__garage_rpc_secret Parameters__garage_admin_token Parameters__garage_access_key_id Parameters__garage_secret_access_key; do
            [[ -n "${!parameter}" ]] || { echo "Missing persistent Garage secret: $parameter"; exit 1; }
          done
          docker context create "$DOCKER_CONTEXT_NAME" --docker "host=ssh://$DEPLOY_USER@$DEPLOY_HOST"
          docker context use "$DOCKER_CONTEXT_NAME"
          aspire deploy --environment Production --non-interactive
      - name: Verify application health
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://detour.patrickbm.com' }}
        run: |
          public_host=$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlparse(os.environ["PUBLIC_URL"]).hostname or "")')
          [[ "$public_host" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 1
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused -H 'Host: $public_host' http://127.0.0.1:48327/health"
      - name: Remove temporary Docker context
        if: always()
        run: |
          docker context use default
          docker context rm "$DOCKER_CONTEXT_NAME" || true
