name: Verify Detour

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Backend tests with isolated PostgreSQL schemas
        env:
          TRIPADVISOR_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password;Database=postgres
        run: dotnet test tests/Detour.Api.Tests/Detour.Api.Tests.csproj --configuration Release --verbosity minimal
      - name: Frontend tests and build
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
