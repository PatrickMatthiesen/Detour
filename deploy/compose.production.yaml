# Apply after the Compose file emitted by `aspire publish`.
# cloudflared on the same host connects to http://127.0.0.1:8080.
services:
  compose-dashboard:
    ports: !reset []
  postgres:
    restart: unless-stopped
  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "false"
      Auth__AllowLocalDev: "false"
      Auth__TrustedProxies__0: "${WEB_PROXY_IP:?Set the web gateway IP on the dedicated app network}"
      Auth__PublicUrl: "${PUBLIC_URL:?Set the canonical HTTPS app URL}"
      AllowedHosts: "${PUBLIC_HOST:?Set the public hostname without scheme}"
      Auth__Google__ClientId: "${GOOGLE_CLIENT_ID:?Set Google client ID}"
      Auth__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:?Set Google client secret}"
      Auth__AllowedEmails__0: "${OWNER_EMAIL:?Set the permitted Google email}"
      Auth__OAuth__ClientId: "${CHATGPT_CLIENT_ID:?Set the ChatGPT OAuth client ID}"
      Auth__OAuth__RedirectUris__0: "${CHATGPT_REDIRECT_URI:?Copy the exact ChatGPT callback URI}"
      Auth__SigningCertificate__Path: /run/tripadvisor-certificates/signing.pfx
      Auth__SigningCertificate__Password: "${SIGNING_CERTIFICATE_PASSWORD:?Set signing certificate password}"
      Auth__EncryptionCertificate__Path: /run/tripadvisor-certificates/encryption.pfx
      Auth__EncryptionCertificate__Password: "${ENCRYPTION_CERTIFICATE_PASSWORD:?Set encryption certificate password}"
      DataProtection__KeysPath: /var/lib/tripadvisor/keys
    volumes:
      - type: bind
        source: "${AUTH_CERTIFICATES_DIR:?Set absolute certificates directory}"
        target: /run/tripadvisor-certificates
        read_only: true
      - type: bind
        source: "${AUTH_KEYS_DIR:?Set absolute persistent cookie-key directory}"
        target: /var/lib/tripadvisor/keys
  web:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8080:5000"
    environment:
      # The gateway is loopback-published and reachable through the tunnel only.
      # Restore cloudflared's external HTTPS scheme before YARP forwards to API.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      REVERSEPROXY__ROUTES__health__CLUSTERID: api
      REVERSEPROXY__ROUTES__health__MATCH__PATH: /health
      REVERSEPROXY__ROUTES__auth__CLUSTERID: api
      REVERSEPROXY__ROUTES__auth__MATCH__PATH: /auth/{**catch-all}
      REVERSEPROXY__ROUTES__connect__CLUSTERID: api
      REVERSEPROXY__ROUTES__connect__MATCH__PATH: /connect/{**catch-all}
      REVERSEPROXY__ROUTES__google__CLUSTERID: api
      REVERSEPROXY__ROUTES__google__MATCH__PATH: /signin-google
      REVERSEPROXY__ROUTES__discovery__CLUSTERID: api
      REVERSEPROXY__ROUTES__discovery__MATCH__PATH: /.well-known/{**catch-all}
      REVERSEPROXY__ROUTES__mcp__CLUSTERID: api
      REVERSEPROXY__ROUTES__mcp__MATCH__PATH: /mcp/{**catch-all}
    networks:
      aspire:
        ipv4_address: "${WEB_PROXY_IP:?Set the web gateway IP}"
networks:
  aspire:
    ipam:
      config:
        - subnet: "${APP_NETWORK_SUBNET:?Choose an unused private subnet for this app}"
          gateway: "${APP_NETWORK_GATEWAY:?Set the gateway in the chosen subnet}"
